<script>(function(){
var D=[70,80,90,100,110,50,60,110,100,100,100,130],N=12,i=0,run=null,sp=1,imgs=[];
for(var k=0;k<N;k++){var im=new Image();im.onload=draw;im.src='native/XX.png'.replace('XX',('0'+k).slice(-2));imgs.push(im);}
var cv=document.getElementById('c_back_l_Axe_full'),ctx=cv.getContext('2d');
function draw(){ctx.clearRect(0,0,128,128);ctx.drawImage(imgs[i],0,0);
document.getElementById('i_back_l_Axe_full').textContent=' F'+('0'+(i+1)).slice(-2)+'/'+D[i]+'ms';}
function next(){i=(i+1)%N;draw();if(run)run=setTimeout(next,D[i]/sp);}
window.step_back_l_Axe_full=function(d){if(!run){i=(i+d+N)%N;draw();}};
window.toggle_back_l_Axe_full=function(){if(run){clearTimeout(run);run=null;}else{run=setTimeout(next,D[i]/sp);}};
window.sp_back_l_Axe_full=sp;var so=document.querySelector('select');if(so){so.onchange=function(){sp=parseFloat(this.value);};}
draw();})();</script>
