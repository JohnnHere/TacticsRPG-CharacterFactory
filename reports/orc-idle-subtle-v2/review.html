<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infante de Ferro · Idle mais sutil</title><style>body{background:#16252a;color:#e5eae7;font:16px/1.5 system-ui;margin:24px}a{color:#dfc18b}.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}article{padding:20px;background:#24383d;border:1px solid #566f74;border-radius:8px}.stage{display:flex;justify-content:center;background:repeating-conic-gradient(#293b40 0 25%,#374d52 0 50%) 0/20px 20px}canvas{width:384px;height:384px;image-rendering:pixelated;max-width:100%;object-fit:contain}button{font:inherit;padding:8px;background:#344b53;color:white;border:1px solid #68818a}</style><h1>Infante de Ferro · Idle mais sutil</h1><p>Poses completas preservadas. Respiração com menor amplitude e ciclo mais tranquilo.</p><p><a href="../../Biblioteca de Arte/index.html">Abrir Biblioteca de Arte</a></p><button id="play">Pausar</button><div class="pair"><article><h2>Anterior</h2><p>8 quadros · ciclo de 1,6 s · oscilação de cabeça de 4 px</p><div class="stage"><canvas id="before" width="128" height="128"></canvas></div></article><article><h2>Mais sutil</h2><p>4 poses reaproveitadas · ciclo de 2,8 s · oscilação de cabeça de 1 px</p><div class="stage"><canvas id="after" width="128" height="128"></canvas></div></article></div><script>const clips=[[{"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/00.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/01.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/02.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/03.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/04.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/05.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/06.png", "durationMs": 200}, {"png": "experiments/orc-infante-idle-subtle-v2/before/source/studies/Idle/07.png", "durationMs": 200}], [{"png": "experiments/orc-infante-idle-subtle-v2/after/00.png", "durationMs": 650}, {"png": "experiments/orc-infante-idle-subtle-v2/after/01.png", "durationMs": 750}, {"png": "experiments/orc-infante-idle-subtle-v2/after/02.png", "durationMs": 750}, {"png": "experiments/orc-infante-idle-subtle-v2/after/03.png", "durationMs": 650}]];const cache=new Map,ids=['before','after'],views=[{n:0,t:0},{n:0,t:0}];let playing=true,ready=false,last=0;function asset(p){if(!cache.has(p))cache.set(p,new Promise((ok,no)=>{const im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src='../../'+p}));return cache.get(p)}async function draw(i){const im=await asset(clips[i][views[i].n].png),ctx=document.getElementById(ids[i]).getContext('2d');ctx.clearRect(0,0,128,128);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,0,0)}Promise.all(clips.flat().map(f=>asset(f.png))).then(()=>Promise.all([draw(0),draw(1)])).then(()=>{ready=true;document.body.dataset.ready='true'});document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pausar':'Reproduzir'};function tick(t){const dt=last?Math.min(t-last,100):0;last=t;if(ready&&playing)for(let i=0;i<2;i++){views[i].t+=dt;if(views[i].t>=clips[i][views[i].n].durationMs){views[i].t-=clips[i][views[i].n].durationMs;views[i].n=(views[i].n+1)%clips[i].length;draw(i)}}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
